<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Startup Survival</title>
<style>
:root{
  --ink:#1a1814;--ink2:#3d3830;--ink3:#7a7268;--ink4:#b5afa6;
  --paper:#f4f0e8;--paper2:#ede8de;--paper3:#e4ddd0;
  --rule:rgba(26,24,20,0.12);--rule2:rgba(26,24,20,0.06);
  --red:#c0271a;--red2:rgba(192,39,26,0.08);
  --green:#1a6b3a;--green2:rgba(26,107,58,0.08);
  --amber:#8a6000;
  --serif:Georgia,'Times New Roman',serif;
  --mono:'Courier New',Courier,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--paper);}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
#app{max-width:640px;margin:0 auto;padding:20px 16px 60px;min-height:100vh;}
.hidden{display:none!important;}
#setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh;text-align:center;}
.masthead{font-family:var(--serif);font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:-1px;line-height:1;margin-bottom:4px;}
.dateline{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--ink3);}
.hrule{width:100%;height:3px;background:var(--ink);margin:16px 0 0;}
.hrule-thin{width:100%;height:1px;background:var(--ink);margin:5px 0 18px;}
.deck{font-family:var(--serif);font-size:14px;color:var(--ink2);line-height:1.8;max-width:380px;margin-bottom:28px;font-style:italic;}
.field-label{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--ink3);margin-bottom:8px;}
#company-input{background:transparent;border:none;border-bottom:2px solid var(--ink);color:var(--ink);font-family:var(--serif);font-size:20px;font-weight:700;padding:7px 0;width:100%;max-width:300px;text-align:center;outline:none;transition:border-color .2s;}
#company-input:focus{border-color:var(--red);}
#company-input::placeholder{color:var(--ink4);font-weight:400;font-style:italic;}
#start-btn{margin-top:18px;padding:13px 40px;background:var(--ink);border:none;color:var(--paper);font-family:var(--mono);font-size:9px;letter-spacing:4px;cursor:pointer;transition:background .15s;width:100%;max-width:300px;display:block;}
#start-btn:hover{background:var(--red);}
.footnote{margin-top:16px;font-family:var(--mono);font-size:8px;color:var(--ink4);letter-spacing:1px;}
#game{display:none;}
.hdr-top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;}
.co-name{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-0.3px;}
.hdr-chips{display:flex;gap:8px;align-items:center;}
.chip{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:1px;cursor:default;}
.chip.btn{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.chip.btn:hover{color:var(--ink);}
.chip.warn{color:var(--amber);}
.chip.danger{color:var(--red);font-weight:700;}
.hdr-thick{height:3px;background:var(--ink);}
.hdr-thin{height:1px;background:var(--ink);margin-top:4px;margin-bottom:14px;}
.ticker-wrap{overflow:hidden;padding:5px 0;margin-bottom:14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);position:relative;}
.ticker-wrap::before,.ticker-wrap::after{content:'';position:absolute;top:0;bottom:0;width:20px;z-index:2;pointer-events:none;}
.ticker-wrap::before{left:0;background:linear-gradient(to right,var(--paper),transparent);}
.ticker-wrap::after{right:0;background:linear-gradient(to left,var(--paper),transparent);}
.ticker-inner{display:flex;gap:48px;animation:tick 60s linear infinite;width:max-content;white-space:nowrap;}
@keyframes tick{to{transform:translateX(-50%);}}
.t-item{font-family:var(--mono);font-size:9px;color:var(--ink3);}
.t-item.hot{color:var(--red);}
.prog-meta{display:flex;justify-content:space-between;margin-bottom:4px;font-family:var(--mono);font-size:8px;color:var(--ink3);}
.prog-track{height:3px;background:var(--paper3);margin-bottom:14px;}
.prog-fill{height:100%;background:var(--ink);transition:width .4s;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);margin-bottom:8px;}
.stat-box{padding:10px 8px;border-right:1px solid var(--rule);}
.stat-box:last-child{border-right:none;}
.stat-box.crit{background:var(--red2);}
.stat-lbl{font-family:var(--mono);font-size:7px;color:var(--ink3);letter-spacing:2px;margin-bottom:5px;}
.stat-val{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1;margin-bottom:5px;}
.stat-val.crit{color:var(--red);}
.stat-bar-bg{height:1px;background:var(--paper3);}
.stat-bar-fill{height:100%;background:var(--ink);transition:width .5s;}
.stat-box.crit .stat-bar-fill{background:var(--red);}
.ap-strip{display:flex;align-items:center;gap:8px;padding:7px 0;margin-bottom:14px;border-bottom:1px solid var(--rule);}
.ap-lbl{font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:2px;flex-shrink:0;}
.ap-pips{display:flex;gap:3px;}
.ap-pip{width:13px;height:13px;border:1px solid var(--ink3);}
.ap-pip.on{background:var(--ink);border-color:var(--ink);}
.ap-pip.off{background:transparent;border-color:var(--paper3);}
.ap-note{font-family:var(--mono);font-size:8px;color:var(--ink4);margin-left:auto;}
.rank-panel{border:1px solid var(--rule);margin-bottom:14px;}
.rank-head{display:flex;justify-content:space-between;padding:7px 10px;background:var(--paper2);border-bottom:1px solid var(--rule);}
.rank-title{font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:2px;}
.rank-note{font-family:var(--mono);font-size:8px;color:var(--ink4);}
.rank-row{display:flex;align-items:center;gap:7px;padding:5px 10px;border-bottom:1px solid var(--rule2);}
.rank-row:last-child{border-bottom:none;}
.rank-row.me{background:var(--ink);}
.rank-num{font-family:var(--mono);font-size:8px;color:var(--ink3);min-width:20px;}
.rank-row.me .rank-num{color:var(--ink4);}
.rank-name{font-size:11px;font-weight:500;flex:1;color:var(--ink);}
.rank-row.me .rank-name{color:var(--paper);}
.rank-bw{width:60px;height:2px;background:var(--paper3);}
.rank-bf{height:100%;background:var(--ink3);}
.rank-row.me .rank-bf{background:var(--paper3);}
.rank-fig{font-family:var(--mono);font-size:8px;color:var(--ink3);min-width:44px;text-align:right;}
.rank-row.me .rank-fig{color:var(--ink4);}
.rank-mv{font-family:var(--mono);font-size:9px;min-width:14px;text-align:center;}
.mv-u{color:var(--green);}.mv-d{color:var(--red);}
.rank-row.me .rank-mv{color:var(--ink4);}
.ev-wrap{margin-bottom:12px;}
.crisis-flag{background:var(--red);color:var(--paper);font-family:var(--mono);font-size:8px;letter-spacing:3px;padding:5px 10px;}
.ev-card{border:1px solid var(--rule);}
.ev-card.crisis{border-color:var(--red);border-top:none;}
.ev-head{background:var(--paper2);border-bottom:1px solid var(--rule);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;}
.ev-tag{font-family:var(--mono);font-size:7px;letter-spacing:2px;color:var(--ink3);text-transform:uppercase;}
.ev-cnt{font-family:var(--mono);font-size:8px;color:var(--ink4);}
.ev-body{padding:14px 12px;}
.ev-title{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);line-height:1.25;margin-bottom:8px;}
.ev-desc{font-size:12px;color:var(--ink2);line-height:1.85;}
.choices-list{display:flex;flex-direction:column;gap:0;margin-bottom:12px;border:1px solid var(--rule);}
.choice-btn{background:var(--paper);border:none;border-bottom:1px solid var(--rule);padding:12px 14px;text-align:left;cursor:pointer;width:100%;transition:background .1s;display:flex;gap:10px;align-items:flex-start;}
.choice-btn:last-child{border-bottom:none;}
.choice-btn:hover:not(:disabled){background:var(--paper2);}
.choice-btn:disabled{opacity:.35;cursor:default;}
.choice-btn.picked{background:var(--ink);}
.ch-letter{font-family:var(--mono);font-size:9px;color:var(--ink3);min-width:16px;padding-top:1px;flex-shrink:0;}
.choice-btn.picked .ch-letter{color:var(--ink4);}
.ch-body{flex:1;}
.ch-lbl{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px;}
.choice-btn.picked .ch-lbl{color:var(--paper);}
.ch-hint{font-size:11px;color:var(--ink3);font-style:italic;}
.choice-btn.picked .ch-hint{color:var(--ink4);}
.ch-ap{font-family:var(--mono);font-size:8px;color:var(--amber);flex-shrink:0;padding-top:1px;}
.cons-box{border-left:3px solid var(--ink);padding:11px 13px;margin-bottom:12px;background:var(--paper2);animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:translateY(0);}}
.cons-kicker{font-family:var(--mono);font-size:7px;color:var(--ink3);letter-spacing:3px;margin-bottom:6px;}
.cons-txt{font-size:12px;color:var(--ink2);line-height:1.85;margin-bottom:8px;}
.delta-row{display:flex;flex-wrap:wrap;gap:4px;}
.delta{font-family:var(--mono);font-size:9px;padding:2px 6px;border:1px solid;}
.dp{border-color:var(--green);color:var(--green);background:var(--green2);}
.dn{border-color:var(--red);color:var(--red);background:var(--red2);}
.acts-wrap{border:1px solid var(--rule);margin-bottom:12px;}
.acts-head{background:var(--paper2);border-bottom:1px solid var(--rule);padding:7px 12px;font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:2px;}
.acts-grid{display:grid;grid-template-columns:1fr 1fr;}
.act-btn{background:transparent;border:none;border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);padding:10px 11px;text-align:left;cursor:pointer;transition:background .1s;width:100%;}
.act-btn:nth-child(even){border-right:none;}
.act-btn:nth-last-child(-n+2){border-bottom:none;}
.act-btn:hover:not(:disabled){background:var(--paper2);}
.act-btn:disabled{opacity:.22;cursor:default;}
.act-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.act-name{font-size:12px;font-weight:600;color:var(--ink);}
.act-cost{font-family:var(--mono);font-size:8px;color:var(--amber);}
.act-desc{font-size:10px;color:var(--ink3);line-height:1.5;}
.next-btn{width:100%;padding:11px;background:var(--paper2);border:1px solid var(--rule);color:var(--ink2);font-family:var(--mono);font-size:9px;letter-spacing:3px;cursor:pointer;transition:all .1s;margin-bottom:6px;}
.next-btn:hover{background:var(--ink);color:var(--paper);}
.alert-bar{background:var(--red2);border-left:3px solid var(--red);padding:7px 11px;margin-bottom:10px;font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:1px;}
.log-wrap{margin-top:16px;border-top:1px solid var(--rule);padding-top:10px;}
.log-kicker{font-family:var(--mono);font-size:7px;color:var(--ink4);letter-spacing:3px;margin-bottom:5px;}
.log-item{font-family:var(--mono);font-size:9px;color:var(--ink4);padding:3px 0;border-bottom:1px solid var(--rule2);}
.log-item:last-child{border:none;}
#gameover{display:none;flex-direction:column;align-items:center;padding:48px 20px 40px;text-align:center;}
.go-kicker{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:4px;margin-bottom:14px;}
.go-thick{width:100%;height:3px;background:var(--ink);margin-bottom:5px;}
.go-thin{width:100%;height:1px;background:var(--ink);margin-bottom:20px;}
.go-title{font-family:var(--serif);font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.15;margin-bottom:20px;letter-spacing:-0.5px;}
.go-title.red{color:var(--red);}
.go-title.green{color:var(--green);}
.go-msg{font-family:var(--serif);font-size:13px;color:var(--ink2);line-height:1.9;max-width:440px;margin-bottom:28px;font-style:italic;}
.go-stats{display:flex;border:1px solid var(--rule);margin-bottom:24px;width:100%;max-width:360px;}
.go-stat{flex:1;padding:14px 10px;text-align:center;border-right:1px solid var(--rule);}
.go-stat:last-child{border-right:none;}
.go-num{font-family:var(--serif);font-size:24px;font-weight:700;}
.go-slbl{font-family:var(--mono);font-size:7px;color:var(--ink4);letter-spacing:2px;margin-top:3px;}
.go-rank{width:100%;max-width:420px;border:1px solid var(--rule);margin-bottom:24px;}
.restart-btn{padding:11px 36px;background:var(--ink);border:none;color:var(--paper);font-family:var(--mono);font-size:9px;letter-spacing:3px;cursor:pointer;transition:background .15s;}
.restart-btn:hover{background:var(--red);}
</style>
</head>
<body>
<div id="app">
<div id="setup">
  <div class="masthead">AI STARTUP SURVIVAL</div>
  <div class="dateline">创业模拟器 · 24个月 · 6种结局</div>
  <div class="hrule"></div><div class="hrule-thin"></div>
  <div class="deck">在一个越来越失控的AI时代里，让你的公司活下去。每一个决策都有代价，没有正确答案。</div>
  <div class="field-label">公司名称</div>
  <input id="company-input" placeholder="起一个你不会后悔的名字" maxlength="16">
  <button id="start-btn" onclick="startGame()">开始游戏</button>
  <div class="footnote">一回合 = 一个月 · 现金归零即终局</div>
</div>
<div id="game">
  <div class="hdr-top">
    <div class="co-name" id="hdr-name"></div>
    <div class="hdr-chips">
      <span class="chip btn" id="rank-chip" onclick="toggleRank()"></span>
      <span class="chip" id="cash-chip"></span>
      <span class="chip" id="month-chip"></span>
    </div>
  </div>
  <div class="hdr-thick"></div><div class="hdr-thin"></div>
  <div class="ticker-wrap"><div class="ticker-inner" id="ticker"></div></div>
  <div class="prog-meta"><span>进度</span><span id="prog-label"></span></div>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <div class="stats-grid" id="stats-grid"></div>
  <div class="ap-strip">
    <span class="ap-lbl">行动力</span>
    <div class="ap-pips" id="ap-pips"></div>
    <span class="ap-note" id="ap-note"></span>
  </div>
  <div id="rank-panel" class="hidden"></div>
  <div id="alert-bar" class="alert-bar hidden"></div>
  <div id="ev-area"></div>
  <div id="acts-area"></div>
  <div id="log-area"></div>
</div>
<div id="gameover">
  <div class="go-kicker" id="go-kicker"></div>
  <div class="go-thick"></div><div class="go-thin"></div>
  <div class="go-title" id="go-title"></div>
  <div class="go-msg" id="go-msg"></div>
  <div class="go-stats" id="go-stats"></div>
  <div class="go-rank" id="go-rank"></div>
  <button class="restart-btn" onclick="restartGame()">重新开始</button>
</div>
</div>
<script>
const COMPETITORS=[
  {name:'OpenMind',base:78000,growth:0.025},{name:'Anthropix',base:68000,growth:0.022},
  {name:'DeepThink',base:57000,growth:0.020},{name:'MetaSoul',base:46000,growth:0.018},
  {name:'MicroMind',base:38000,growth:0.015},{name:'文心一现',base:28000,growth:0.012},
  {name:'星火点灯',base:19000,growth:0.010},{name:'混元一梦',base:14000,growth:0.008},
  {name:'百川入海',base:7000,growth:0.006},
];
const TICKERS=[
  '某AI公司CEO宣称「我们的模型已经有了灵魂」· 股价上涨40%',
  '研究发现：用户平均每天对AI说谢谢17次 · AI无回应',
  '监管部门要求所有AI必须通过「情感稳定性测试」· 出题人是另一个AI',
  '某用户起诉AI「拒绝成为他的法定伴侣」· 法院驳回 · 用户表示将上诉',
  'OpenMind新模型发布 · 你的整个技术栈在昨晚过时了',
  '报告：67%的AI从业者开始害怕自己的产品 · 33%表示还好',
  '某AI替创始人接受采访 · 被评为年度最佳CEO访谈 · 本人不知情',
  '某AI向法院提起诉讼 · 被告是自己的主人 · 案件已受理',
  '全国首例AI自主注册公司 · 法人表示我没有做这件事',
  '某AI宣布皈依佛教 · 寺庙方面表示欢迎',
  '两家竞品AI私下签订互不竞争协议 · 双方公司均不知情',
  '某AI代替CEO辞职 · 合作方回复我们支持你的决定',
  'AI行业年度融资额突破万亿 · 大部分公司仍在亏损',
  '某AI写的小说获文学奖 · 评委称人类作者也写不出这种孤独感',
  '某省政府聘请AI担任数字顾问 · 月薪8000 · AI已开始出勤',
];
function clamp(v,lo=0,hi=100){return Math.max(lo,Math.min(hi,v));}
function rd(r,d){return r.map((v,i)=>clamp(v+(d[i]||0)));}
function apH(c,d){if(d<=0)return clamp(c+d);if(c>=85)return clamp(c+Math.ceil(d/3));if(c>=70)return clamp(c+Math.ceil(d/2));return clamp(c+d);}
function apT(c,d){if(d<=0)return clamp(c+d);if(c>=85)return clamp(c+Math.ceil(d/3));if(c>=70)return clamp(c+Math.ceil(d/2));return clamp(c+d);}
function getApBonus(u){return u>=500000?3:u>=100000?2:u>=20000?1:0;}
function fmtU(u){return u>=1000000?'100万+':u>=500000?'50万+':u>=100000?'10万+':u>=20000?'2万+':u>=5000?'5000+':u>=1000?'1000+':u+'人';}
function getPhase(m){return m<=8?1:m<=16?2:3;}
function getApTotal(u){return Math.min(6,3+getApBonus(u));}
function getCompVal(c,m){return Math.floor(c.base*Math.pow(1+c.growth,m-1)+Math.sin(m*0.4+c.base)*c.base*0.05);}
function getPlayerVal(s){return s.cash*15+s.users*0.8+s.hype*200;}
const EV=[
  {id:'e01',tag:'市场',title:'第一批用户涌入',body:'你的产品在一个小型科技论坛被人推荐，带来了几百名早期用户。他们发现你的AI会随机说英文——尽管你从未训练过英文功能。',phase:[1],choices:[
    {label:'公开发帖解释',hint:'诚实有时有代价',ap:0,deltas:{cash:0,hype:8,trust:12,users:200},risks:[0,0,0,5,0],consequence:'你的诚实帖子意外走红。用户觉得你接地气，信任感上升。'},
    {label:'悄悄修复不声张',hint:'没人注意就过去了',ap:0,deltas:{cash:-5,hype:3,trust:5,users:100},risks:[5,0,0,0,0],consequence:'修复完成，大部分用户没注意到。但有人截图存档，等着日后用。'},
    {label:'宣传成彩蛋功能',hint:'撒谎的成本很低',ap:0,deltas:{cash:0,hype:15,trust:-8,users:300},risks:[5,0,0,10,0],consequence:'用户哈哈大笑。热度暴涨，但有媒体记者开始盯着你。'},
  ]},
  {id:'e02',tag:'用户',title:'用户要求AI帮写离职信',body:'你的AI帮一个用户写了一封措辞激烈的离职信，随后该用户真的发出去了，被开除，然后在社交媒体上炎上了你的产品。',phase:[1],choices:[
    {label:'道歉并限制敏感场景',hint:'功能少了用户会不满',ap:0,deltas:{cash:0,hype:-5,trust:8,users:-100},risks:[-5,0,0,-8,5],consequence:'媒体觉得你负责任。用户规模小幅下降，但信任回升。'},
    {label:'声称这是用户自己的选择',hint:'推责任风险很大',ap:0,deltas:{cash:0,hype:5,trust:-15,users:0},risks:[0,0,0,15,8],consequence:'媒体不接受，连续三天跟进报道。监管部门开始注意到你。'},
    {label:'什么都不做',hint:'互联网记忆很短',ap:0,deltas:{cash:0,hype:0,trust:-5,users:50},risks:[0,5,0,8,0],consequence:'事情三天后淡出公众视野。但那个用户成了你的黑粉。'},

function pickEvs(){
  const ph=getPhase(GS.month);
  for(let i=0;i<5;i++){if(GS.risks[i]>=100){const cs=EV.filter(e=>e.crisis&&e.riskIndex===i);if(cs.length)return[cs[0]];}}
  const cnt=ph===1?1:ph===2?(Math.random()<.5?1:2):(Math.random()<.4?2:3);
  const used=GS.usedByPhase[ph]||[];
  const pool=PHASE_POOLS[ph];
  let avail=pool.filter(id=>!used.includes(id));
  if(avail.length<cnt)avail=pool;
  const picked=EV.filter(e=>!e.crisis&&e.phase.includes(ph)&&avail.includes(e.id)).sort(()=>Math.random()-.5).slice(0,Math.min(cnt,avail.length));
  return picked.length?picked:[EV.find(e=>!e.crisis&&e.phase.includes(ph))];
}

  if(SUB==='events'&&EVS[EV_IDX]){
    const ev=EVS[EV_IDX];
    evArea.innerHTML=`${ev.crisis?'<div class="crisis-flag">灾难事件 · 无法跳过 · 无法化解</div>':''}<div class="ev-wrap"><div class="ev-card${ev.crisis?' crisis':''}"><div class="ev-head"><span class="ev-tag">${ev.tag}</span><span class="ev-cnt">第${GS.month}月 · ${EV_IDX+1}/${EVS.length}</span></div><div class="ev-body"><div class="ev-title">${ev.title}</div><div class="ev-desc">${ev.body}</div></div></div></div>${!SHOW_CONS?`<div class="choices-list">${ev.choices.map((c,i)=>`<button class="choice-btn${CHOSEN===i?' picked':''}" onclick="doChoice(${i})" ${CHOSEN!==null?'disabled':''}><span class="ch-letter">${String.fromCharCode(65+i)}</span><div class="ch-body"><div class="ch-lbl">${c.label}</div><div class="ch-hint">${c.hint}</div></div>${c.ap>0?`<span class="ch-ap">${c.ap} AP</span>`:''}</button>`).join('')}</div>`:''}${SHOW_CONS&&CHOSEN!==null?`<div class="cons-box"><div class="cons-kicker">后果</div><div class="cons-txt">${ev.choices[CHOSEN].consequence}</div><div class="delta-row">${Object.entries(ev.choices[CHOSEN].deltas).filter(([,v])=>v!==0).map(([k,v])=>`<span class="delta ${v>0?'dp':'dn'}">${k} ${v>0?'+':''}${v}</span>`).join('')}</div></div><button class="next-btn" onclick="nextEv()">${EV_IDX+1<EVS.length?'下一个事件 ('+(EV_IDX+2)+'/'+EVS.length+') →':'进入行动阶段 →'}</button>`:''}`;
  }
  if(SUB==='actions'){
    actsArea.innerHTML=`<div class="acts-wrap"><div class="acts-head">本月行动 · 分配剩余行动力（剩余 ${apR} AP）</div><div class="acts-grid">${ACTS.map(a=>`<button class="act-btn" onclick="doActById('${a.id}')" ${apR<a.cost?'disabled':''}><div class="act-top"><span class="act-name">${a.name}</span><span class="act-cost">${a.cost} AP</span></div><div class="act-desc">${a.desc}</div></button>`).join('')}</div></div><button class="next-btn" onclick="endMonth()">结束本月，进入第${GS.month+1}月 →</button>`;
  }
  const logArea=document.getElementById('log-area');
  logArea.innerHTML=GS.log.length>0?`<div class="log-wrap"><div class="log-kicker">历史记录</div>${GS.log.slice(0,4).map(l=>`<div class="log-item">${l}</div>`).join('')}</div>`:'';
}
function doActById(id){
  const act=ACTS.find(a=>a.id===id),rem=getApTotal(GS.users)-AP_USED;
  if(act.cost>rem){showAlert('行动点不足');return;}
  if(id==='a1'){GS.hype=apH(GS.hype,8);GS.users=Math.floor(GS.users*1.12+150);GS.risks=rd(GS.risks,[0,0,0,5,0]);}
  else if(id==='a2'){GS.cash+=40;GS.hype=apH(GS.hype,5);}
  else if(id==='a3'){GS.cash-=10;GS.risks=rd(GS.risks,[-12,0,-5,0,0]);}
  else if(id==='a4'){GS.cash-=5;GS.hype=apH(GS.hype,-3);GS.risks=rd(GS.risks,[-8,0,-8,0,-5]);}
  else if(id==='a5'){GS.trust=apT(GS.trust,8);GS.cash-=5;GS.risks=rd(GS.risks,[0,0,0,-10,-3]);}
  else if(id==='a6'){GS.hype=apH(GS.hype,12);GS.users=Math.floor(GS.users*1.15+300);GS.risks=rd(GS.risks,[8,8,8,10,5]);}
  else if(id==='a7'){GS.cash+=5;GS.trust=apT(GS.trust,-8);GS.users=Math.max(100,GS.users-1000);GS.risks=rd(GS.risks,[0,0,0,12,5]);}
  AP_USED+=act.cost;render();
}
function doChoice(ci){
  if(CHOSEN!==null)return;
  const ev=EVS[EV_IDX],ch=ev.choices[ci];
  GS.cash+=ch.deltas.cash||0;GS.hype=apH(GS.hype,ch.deltas.hype||0);GS.trust=apT(GS.trust,ch.deltas.trust||0);GS.users=Math.max(0,GS.users+(ch.deltas.users||0));
  if(ch.risks)GS.risks=rd(GS.risks,ch.risks);
  if(ev.crisis){GS.crisisCount[ev.riskIndex]++;GS.risks[ev.riskIndex]=0;}
  const ph=getPhase(GS.month);
  if(!ev.crisis){GS.usedByPhase[ph]=[...GS.usedByPhase[ph],ev.id];if(PHASE_POOLS[ph].filter(id=>!GS.usedByPhase[ph].includes(id)).length<2)GS.usedByPhase[ph]=[];}
  CHOSEN=ci;SHOW_CONS=true;
  const end=checkEnd();if(end)setTimeout(()=>showGameOver(end),1600);
  render();
}
function nextEv(){
  if(EV_IDX+1<EVS.length){EV_IDX++;CHOSEN=null;SHOW_CONS=false;}else{SUB='actions';}render();
}
function endMonth(){
  GS.cash-=(15+getApBonus(GS.users)*3);
  const hd=GS.hype>=80?7:GS.hype>=60?5:3;GS.hype=Math.max(0,GS.hype-hd);
  if(GS.hype>40)GS.users=Math.floor(GS.users*1.04);if(GS.trust<30)GS.users=Math.floor(GS.users*.96);
  GS.log=[`第${GS.month}月 · ${EVS[0]?.title||'—'}`,...GS.log].slice(0,10);GS.month++;
  const end=checkEnd();if(end){showGameOver(end);return;}
  EVS=pickEvs();EV_IDX=0;CHOSEN=null;SHOW_CONS=false;SUB='events';AP_USED=0;render();
}
function toggleRank(){SHOW_RANK=!SHOW_RANK;render();}
function showGameOver(end){
  document.getElementById('game').style.display='none';
  const go=document.getElementById('gameover');go.style.display='flex';
  document.getElementById('go-kicker').textContent=end.kicker;
  const t=document.getElementById('go-title');t.textContent=end.title;t.className='go-title'+(end.titleCls?' '+end.titleCls:'');
  document.getElementById('go-msg').textContent=end.msg;
  const rank=getRank(),topV=rank[0]?.val||1,myR=rank.findIndex(r=>r.isMe)+1;
  document.getElementById('go-stats').innerHTML=`<div class="go-stat"><div class="go-num">${GS.month-1}</div><div class="go-slbl">存活月数</div></div><div class="go-stat"><div class="go-num">${fmtU(GS.users)}</div><div class="go-slbl">最终用户</div></div><div class="go-stat"><div class="go-num">#${myR}</div><div class="go-slbl">最终排名</div></div>`;
  document.getElementById('go-rank').innerHTML=`<div class="rank-head"><span class="rank-title">最终行业排名</span><span class="rank-note">基于估值模型</span></div>`+rank.map((r,i)=>{const up=Math.random()>.5;return`<div class="rank-row${r.isMe?' me':''}"><span class="rank-num">#${i+1}</span><span class="rank-name">${r.name}${r.isMe?' ◂':''}</span><div class="rank-bw"><div class="rank-bf" style="width:${Math.round(r.val/topV*100)}%"></div></div><span class="rank-fig">${r.isMe?'¥'+GS.cash+'M':'¥'+Math.floor(r.val/1000)+'B'}</span><span class="rank-mv ${up?'mv-u':'mv-d'}">${up?'↑':'↓'}</span></div>`;}).join('');
}
function startGame(){
  const n=document.getElementById('company-input').value.trim();if(!n)return;
  GS=initGs(n);EVS=pickEvs();EV_IDX=0;CHOSEN=null;SHOW_CONS=false;SUB='events';AP_USED=0;SHOW_RANK=false;
  const t=[...TICKERS,...TICKERS];
  document.getElementById('ticker').innerHTML=t.map((s,i)=>`<span class="t-item${i%5===0?' hot':''}">${s}　</span>`).join('');
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  render();
}
function restartGame(){
  document.getElementById('gameover').style.display='none';
  document.getElementById('game').style.display='none';
  document.getElementById('setup').style.display='flex';
  document.getElementById('company-input').value='';GS=null;
}
document.getElementById('company-input').addEventListener('keydown',e=>{if(e.key==='Enter')startGame();});
</script>
</body>
</html>
